# ===== CQA backend =====
# Real passwords and API keys are NOT here: put them into application-local.properties
# (same folder, ignored by git). Values there override the ones below.
spring.config.import=optional:classpath:application-local.properties

spring.application.name=cqa-backend
server.port=8080

# PostgreSQL (database "cqa" must exist; tables are created by Flyway on start)
spring.datasource.url=jdbc:postgresql://localhost:5432/cqa
spring.datasource.username=postgres
spring.datasource.password=CHANGE_IN_LOCAL_FILE
spring.flyway.enabled=true
spring.mvc.format.date=iso

# Organizers API WITHOUT group_id (the backend adds &group_id=DEV / PROD itself).
# Organizers confirmed in chat that this link may be stored in the repo.
cqa.organizer-url=https://ec88f21f1accecf38e20095a9fe175.a5.environment.api.powerplatform.com/powerautomate/automations/direct/cu/11/workflows/b3d2a68006a24662be2b721454cb4e00/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=5Sog2MThgCRTlk3HObv70LRmRk6u7IOwzlwMpe804qo

cqa.timezone=Asia/Almaty
# any local port on localhost / 127.0.0.1 (the frontend dev server)
cqa.cors-origins=http://localhost:*,http://127.0.0.1:*
# NAME = operator from "меня зовут ..." in the transcript, POOL = 5 demo operators
cqa.operators-mode=NAME

# results.json for the organizers (folder "results" in the repo root, next to backend/)
cqa.results.dir=../results
cqa.results.team-name=CHANGE_TEAM_NAME

# Automatic hourly import + evaluation of new dialogs (off for the hackathon demo)
cqa.auto.enabled=false
cqa.auto.group-id=DEV
cqa.auto.cron=0 5 * * * *

cqa.rating.period-days=30
cqa.rating.min-dialogs=5
cqa.evaluation.concurrency=4
cqa.evaluation.max-attempts=2
cqa.evaluation.corrections-per-criterion=3

# LLM providers: an empty key = provider switched off. Keys go to application-local.properties
cqa.llm.timeout-seconds=90
cqa.llm.anthropic-key=
cqa.llm.anthropic-model=claude-sonnet-5-5
cqa.llm.openai-key=
cqa.llm.openai-model=gpt-4.1
cqa.llm.gemini-key=
cqa.llm.gemini-model=gemini-2.5-flash

logging.level.kz.freedom.cqa=INFO
